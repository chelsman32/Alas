<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alas | Bekalu - Fashion & Content</title>
    <style>
        /* --- CSS Variables for Theme Toggling --- */
        :root {
            --bg-color: #ffffff;
            --text-color: #121212;
            --nav-bg: rgba(255, 255, 255, 0.9);
            --card-bg: #f5f5f5;
            --accent: #d4af37; /* Subtle gold */
            --transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f8f8f8;
            --nav-bg: rgba(18, 18, 18, 0.9);
            --card-bg: #1e1e1e;
            --accent: #ebd58b;
        }

        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color var(--transition), color var(--transition);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Navigation & Controls --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            color: var(--accent);
        }

        /* --- Hero Section --- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 10%;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .hero p {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            max-width: 600px;
            font-weight: 300;
            opacity: 0.8;
        }

        /* --- Sections --- */
        .section {
            padding: 8rem 10%;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
            font-weight: 800;
            border-bottom: 2px solid var(--text-color);
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        /* --- Work Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            aspect-ratio: 4/5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
